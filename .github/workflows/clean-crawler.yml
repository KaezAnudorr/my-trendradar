name: Check In

# 每 7 天手动签到续期，保留运行历史、新闻数据库和推送去重附件。
# 修改此文件也视为一次显式签到；成功后自动运行 Get Hot News。
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: [.github/workflows/clean-crawler.yml]

permissions:
  actions: write
  contents: read

jobs:
  renew:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TZ: Asia/Shanghai
    steps:
      - name: Re-enable hourly news workflow without deleting history
        run: |
          gh workflow enable crawler.yml --repo "${{ github.repository }}"
          echo "✅ 签到成功，北京时间 $(date '+%Y-%m-%d %H:%M:%S %Z')；续期 7 天。"
          echo "运行历史、累计新闻和推送去重记录均保留；完成后自动触发抓取。"
