name: Validate DailyHot RSS sources
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - .github/workflows/check-dailyhot.yml
permissions:
  contents: read
jobs:
  check:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Probe public RSS endpoints
        run: python tools/check_dailyhot.py
      - uses: actions/upload-artifact@v4
        with:
          name: dailyhot-source-check
          path: dailyhot-check.json
          retention-days: 3

  upstream:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: imsyy/DailyHotApi
          ref: 36c77e3bd891c11642d314cfb229bf31646704de
          path: dailyhot-api
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install and build the pinned upstream
        working-directory: dailyhot-api
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run build
      - uses: astral-sh/setup-uv@v7
      - name: Install TrendRadar dependencies for comparison
        run: uv sync --frozen --no-dev
      - name: Test upstream routes on an ephemeral local server
        env:
          DAILYHOT_BASE_URL: http://127.0.0.1:6688
          NODE_ENV: development
          PORT: '6688'
          USE_LOG_FILE: 'false'
        run: |
          (cd dailyhot-api && node dist/index.js) > dailyhot-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:6688/all > /dev/null; then break; fi
            sleep 1
          done
          PYTHONPATH=. uv run python tools/compare_dailyhot.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dailyhot-upstream-check
          path: |
            dailyhot-check.json
            dailyhot-comparison.json
            dailyhot-server.log
          retention-days: 3

  native-choices:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen --no-dev
      - name: Verify DailyHot adapter contracts
        run: uv run python -m unittest discover -s tests -p test_dailyhot_feeds.py -v
      - name: Check unresolved native feed choices
        run: PYTHONPATH=. uv run python tools/verify_feed_choices.py
      - uses: actions/upload-artifact@v4
        with:
          name: dailyhot-native-choices
          path: dailyhot-followup.json
          retention-days: 3
