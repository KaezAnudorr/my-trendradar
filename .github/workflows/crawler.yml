name: Get Hot News

on:
  push:
    branches: [master]
    paths:
      - config/**
      - trendradar/report/**
      - tests/test_dashboard.py
      - tests/test_dailyhot_feeds.py
      - integrations/dailyhot/**
      - tools/dailyhot_feeds.py
      - trendradar/core/analyzer.py
      - trendradar/__main__.py
      - tests/test_source_grouping.py
      - tests/test_hourly_digest.py
      - tools/check_four_apis.py
      - trendradar/notification/ledger.py
      - trendradar/ai/analyzer.py
      - trendradar/core/loader.py
      - .github/actions/dailyhot/**
      - .github/workflows/crawler.yml
  schedule:
    # 北京时间每小时第 7 分钟错峰抓取；22 点改为单独的整点总结。
    # UTC 14:00 = 北京时间 22:00。GitHub 排队可能延迟，cron 不是准点保证。
    - cron: "7 0-13,15-23 * * *"
    - cron: "0 14 * * *"

  workflow_dispatch:

concurrency:
  group: crawler-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Shanghai

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          clean: true

      - name: Restore cumulative news and delivered-message state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN=$(gh api "repos/${{ github.repository }}/actions/workflows/crawler.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].id // empty')
          if [ -n "$RUN" ]; then
            STATE_DIR="$RUNNER_TEMP/trendradar-state"
            gh run download "$RUN" --repo "${{ github.repository }}" --name trendradar-state --dir "$STATE_DIR"
            mkdir -p output
            cp -R "$STATE_DIR"/. output/
          else
            echo "First stateful run: establish a silent notification baseline"
          fi

      - name: Set up Python
        if: success()
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        if: success()
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        if: success()
        run: uv sync --frozen --no-dev

      - name: Verify required files
        if: success()
        run: |
          if [ ! -f config/config.yaml ]; then
            echo "Error: Config missing"
            exit 1
          fi

      - name: Verify source dashboard
        run: |
          uv run python -m unittest discover -s tests -p test_dashboard.py -v
          uv run python -m unittest discover -s tests -p test_dailyhot_feeds.py -v
          uv run python -m unittest discover -s tests -p test_source_grouping.py -v
          uv run python -m unittest discover -s tests -p test_hourly_digest.py -v

      - name: Prepare DailyHot source snapshots
        id: dailyhot
        uses: ./.github/actions/dailyhot
        continue-on-error: true

      - name: Report DailyHot setup failure
        if: steps.dailyhot.outcome == 'failure'
        run: echo '::warning::DailyHot setup failed; existing RSS feeds will still be fetched. Inspect the DailyHot step logs.'

      - name: Run crawler
        if: success()
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
          WEWORK_WEBHOOK_URL: ${{ secrets.WEWORK_WEBHOOK_URL }}
          WEWORK_MSG_TYPE: ${{ secrets.WEWORK_MSG_TYPE }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_SMTP_SERVER: ${{ secrets.EMAIL_SMTP_SERVER }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER_URL: ${{ secrets.NTFY_SERVER_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          BARK_URL: ${{ secrets.BARK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # 通用Webhook配置
          GENERIC_WEBHOOK_URL: ${{ secrets.GENERIC_WEBHOOK_URL }}
          GENERIC_WEBHOOK_TEMPLATE: ${{ secrets.GENERIC_WEBHOOK_TEMPLATE }}
          # AI 配置（ai_analysis 和 ai_translation 共享模型配置）
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_API_BASE: ${{ secrets.AI_API_BASE }}
          # 远程存储配置
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          S3_REGION: ${{ secrets.S3_REGION }}
          GITHUB_ACTIONS: true
        run: uv run python -m trendradar

      - name: Save cumulative news and notification state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trendradar-state
          path: |
            output/news/*.db
            output/rss/*.db
            output/push-state.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: trendradar-report
          path: output/html/latest/*.html
          if-no-files-found: error
          retention-days: 3

      - name: Upload DailyHot integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dailyhot-integration
          path: |
            output/dailyhot/*.json
            output/dailyhot-server.log
          if-no-files-found: ignore
          retention-days: 3

      # --------------------------------------------------------------------------------
      # ☁️ CLOUDFLARE PAGES DEPLOY / 部署到 Cloudflare Pages（可选）
      # --------------------------------------------------------------------------------
      # 将爬虫生成的 index.html 自动部署到 Cloudflare Pages，国内访问比 GitHub Pages 更快。
      # 仅当下面三个 Secrets 均已配置时才会执行，缺任意一个则自动跳过，不影响其它流程：
      #   - CLOUDFLARE_API_TOKEN     权限：Account → Cloudflare Pages → Edit
      #   - CLOUDFLARE_ACCOUNT_ID    Cloudflare 账户 ID
      #   - CLOUDFLARE_PROJECT_NAME  Cloudflare Pages 项目名（需提前在 Dashboard 创建）
      # 配置教程详见 README「自动部署到 Cloudflare Pages」章节。
      # --------------------------------------------------------------------------------
      - name: Check Cloudflare config
        if: success()
        id: cf_check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$CLOUDFLARE_PROJECT_NAME" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "✅ 检测到 Cloudflare 配置，准备部署到 Cloudflare Pages"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ 未配置 Cloudflare Secrets，跳过 Cloudflare Pages 部署"
          fi

      - name: Prepare Cloudflare Pages assets
        if: success() && steps.cf_check.outputs.enabled == 'true'
        run: |
          if [ ! -f index.html ]; then
            echo "❌ 未找到 index.html，请确认爬虫已生成网页报告"
            exit 1
          fi
          rm -rf cloudflare_dist
          mkdir -p cloudflare_dist
          cp index.html cloudflare_dist/index.html

      - name: Deploy to Cloudflare Pages
        if: success() && steps.cf_check.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy cloudflare_dist --project-name=${{ secrets.CLOUDFLARE_PROJECT_NAME }}

      # A generated data branch for the local reader, not a hosted website.
      - name: Publish latest public-news snapshot for the local reader
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/trendradar-preview"
          REPORT=$(find output/html/latest -name '*.html' -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)
          cp "$REPORT" "$RUNNER_TEMP/trendradar-preview/current.html"
          gh auth setup-git --hostname github.com
          cd "$RUNNER_TEMP/trendradar-preview"
          git init -b generated-preview
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add current.html
          git commit -m 'Update generated news preview'
          git remote add origin "https://github.com/${{ github.repository }}.git"
          git push --force origin HEAD:refs/heads/generated-preview
